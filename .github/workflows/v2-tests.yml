name: V2 offline tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# El CI no requiere credenciales ni conexión a MetaTrader 5.
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - name: Install offline dependencies
        run: python -m pip install -r requirements-v2.txt
      - name: Unit tests (sin conexión MT5)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q trading_v2 scripts
