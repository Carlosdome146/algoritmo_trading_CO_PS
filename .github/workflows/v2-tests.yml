name: V2 offline tests
on:
  pull_request:
  push:
    branches:
      - feature/v2-data-backtest
      - feature/v2-ml-horizons
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v2.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile scripts/diagnostico_admirals_mt5.py
